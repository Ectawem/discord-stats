<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Discord data package statistics</title>
<style>
:root{--bg:#0e1016;--panel:#161a24;--fg:#e8eaf2;--mut:#98a1b8;--line:#2a3042;--acc:124,140,255;--acc2:76,214,178;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f2f3f9;--panel:#fff;--fg:#1a1f30;--mut:#5b6580;--line:#dde1ee;--acc:79,92,214;--acc2:14,150,120;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(900px 420px at 12% -8%,rgba(var(--acc),.18),transparent 70%),radial-gradient(700px 380px at 100% 0,rgba(var(--acc2),.10),transparent 70%),var(--bg)}
main{max-width:760px;margin:0 auto;padding:48px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.brand{font-weight:600;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,rgb(var(--acc)),rgb(var(--acc2)))}
.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.pill button{border:0;background:none;padding:5px 13px;cursor:pointer;color:var(--mut);font:inherit;font-size:13px}
.pill button.on{background:rgb(var(--acc));color:#fff}
h1{font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}
.lead{color:var(--mut);margin:0 0 8px;font-size:18px}
.privacy{margin:14px 0 26px;padding:12px 16px;border-left:3px solid rgb(var(--acc2));background:rgba(var(--acc2),.1);border-radius:0 10px 10px 0}
.drop{border:2px dashed var(--line);border-radius:18px;background:var(--panel);padding:40px 24px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:rgb(var(--acc));background:rgba(var(--acc),.08)}
.drop h2{font-size:22px;font-weight:600;margin:0 0 6px}
.drop p{margin:0 0 20px;color:var(--mut)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:9px 20px;font:inherit;font-size:15px;cursor:pointer}
.btn:hover{border-color:rgb(var(--acc))}
.btn.primary{background:rgb(var(--acc));border-color:rgb(var(--acc));color:#fff}
input[type=file]{display:none}
details{margin-top:26px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--panel)}
summary{cursor:pointer;font-weight:600}
details p{margin:10px 0 0;color:var(--mut)}
.small{color:var(--mut);font-size:14px;margin-top:18px}
#working{text-align:center;padding:50px 20px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
.spin{width:44px;height:44px;margin:0 auto 18px;border-radius:50%;border:4px solid var(--line);border-top-color:rgb(var(--acc));animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#status{font-size:20px;margin:0 0 6px}
#elapsed{color:var(--mut)}
#waitnote{color:var(--mut);font-size:14px;margin:14px 0 0}
#errbox{padding:30px;border:1px solid rgb(240,170,90);border-radius:18px;background:var(--panel)}
#errbox h2{margin:0 0 8px}
#errmsg{color:var(--mut);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand"><i></i>discord-stats</div><span class="pill"><button id="langen" type="button">EN</button><button id="langfr" type="button">FR</button></span></div>
<h1 id="h1"></h1>
<p class="lead" id="lead"></p>
<div class="privacy" id="privacy"></div>
<div id="pick">
<div class="drop" id="drop">
<h2 id="dropt"></h2>
<p id="dropsub"></p>
<div class="row">
<label class="btn primary" id="btnzip">x<input type="file" id="zipin" accept=".zip,application/zip"></label>
<label class="btn" id="btndir">x<input type="file" id="dirin" webkitdirectory></label>
</div>
</div>
<details><summary id="howt"></summary><p id="howb"></p></details>
<p class="small" id="offline"></p>
</div>
<div id="working" hidden>
<div class="spin"></div>
<p id="status"></p>
<p id="elapsed"></p>
<p id="waitnote"></p>
</div>
<div id="errbox" hidden>
<h2 id="errtitle"></h2>
<p id="errmsg"></p>
<button class="btn primary" id="again" type="button"></button>
</div>
</main>
<script src="shell.js"></script>
</body>
</html>
